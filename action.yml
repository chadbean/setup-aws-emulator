name: Setup AWS Emulator
description: Install aws-emulator, start it in the background, and point later steps at it. Telemetry is off by default.
author: Chad Bean
branding:
  icon: cloud
  color: orange

inputs:
  version:
    description: aws-emulator version to install, e.g. 1.0.322. Defaults to the latest published version.
    default: latest
  start:
    description: Start the emulator in the background and wait until it is ready.
    default: "true"
  port:
    description: Port the emulator listens on (127.0.0.1 only).
    default: "9297"
  auth:
    description: SigV4 request authentication, "on" or "off".
    default: "on"
  idle-timeout:
    description: Seconds of inactivity after which the emulator shuts itself down. Empty means never.
    default: ""
  wait-timeout:
    description: Seconds to wait for the emulator to become ready before failing.
    default: "60"
  telemetry:
    description: Allow the emulator to send telemetry. When false, EMULATOR_TELEMETRY=off is exported and --telemetry off is passed.
    default: "false"
  verify-signature:
    description: Verify the package's GPG signature against the pinned AWS signing key.
    default: "true"
  export-env:
    description: Export AWS_ENDPOINT_URL and related variables so later steps use the emulator.
    default: "true"

outputs:
  version:
    description: The installed aws-emulator version (3-part, e.g. 1.0.322).
    value: ${{ steps.install.outputs.version }}
  path:
    description: Directory aws-emulator was installed to.
    value: ${{ steps.install.outputs.path }}
  endpoint-url:
    description: HTTPS endpoint of the running emulator.
    value: ${{ steps.start.outputs.endpoint-url }}
  ca-file:
    description: Path to the emulator's CA certificate (PEM).
    value: ${{ steps.start.outputs.ca-file }}
  credentials-file:
    description: Path to the shared credentials file for the emulator.
    value: ${{ steps.start.outputs.credentials-file }}
  config-file:
    description: Path to the AWS config file for the emulator.
    value: ${{ steps.start.outputs.config-file }}
  pid:
    description: Process ID of the running emulator.
    value: ${{ steps.start.outputs.pid }}
  log-file:
    description: File the emulator's stdout and stderr are written to.
    value: ${{ steps.start.outputs.log-file }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/install.sh"'
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_START: ${{ inputs.start }}
        INPUT_VERIFY_SIGNATURE: ${{ inputs.verify-signature }}
        INPUT_TELEMETRY: ${{ inputs.telemetry }}

    - id: start
      if: steps.install.outputs.start == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/start.sh"'
      env:
        EMULATOR_PATH: ${{ steps.install.outputs.path }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_AUTH: ${{ inputs.auth }}
        INPUT_IDLE_TIMEOUT: ${{ inputs.idle-timeout }}
        INPUT_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        INPUT_TELEMETRY: ${{ inputs.telemetry }}
        INPUT_EXPORT_ENV: ${{ inputs.export-env }}
