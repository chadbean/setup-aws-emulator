name: zizmor

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Pushes to main share a group so only the newest runs. Each pull request run
# gets its own group (by run ID): even with cancel-in-progress off, a shared
# group would still let GitHub cancel a pending run when a newer one queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
