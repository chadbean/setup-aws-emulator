name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
      - uses: actions/checkout@v5
        if: steps.release.outputs.release_created
      - name: Move major tag
        if: steps.release.outputs.release_created
        run: .github/scripts/move-major-tag.sh "$TAG"
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
