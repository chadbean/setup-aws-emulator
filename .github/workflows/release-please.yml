name: Release Please

on:
  push:
    branches: [main]

permissions: {}

# Queue instead of cancelling: a run cancelled between creating a release and
# moving the major tag would leave v1 behind. The newest queued run picks up
# every commit since the last release, so dropping intermediate ones is safe.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    # Everything below uses the GitHub App token, not GITHUB_TOKEN, so release
    # PRs and tags trigger other workflows (CI runs on release PRs).
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # release commits and tags, moving the major tag
          permission-issues: write # autorelease labels on release PRs
          permission-pull-requests: write # release PRs
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] move-major-tag.sh pushes with these credentials; no artifacts are uploaded
        if: steps.release.outputs.release_created
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Move major tag
        if: steps.release.outputs.release_created
        run: .github/scripts/move-major-tag.sh "$TAG"
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
